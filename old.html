<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>A·M — Loader</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --fg: #f3f3f0;
        --dim: #6a6a66;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      .loader {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ring {
        position: absolute;
        border: 1px solid rgba(243, 243, 240, 0.15);
        border-radius: 50%;
        width: 100%;
        height: 100%;
      }
      .core {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--fg);
        animation: breathe 8s ease-in-out infinite;
        filter: blur(0px);
      }
      @keyframes breathe {
        0% {
          transform: scale(0.55);
          opacity: 0.35;
          filter: blur(1px);
        }
        50% {
          transform: scale(1);
          opacity: 1;
          filter: blur(0px);
        }
        100% {
          transform: scale(0.55);
          opacity: 0.35;
          filter: blur(1px);
        }
      }
      .halo {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(243, 243, 240, 0.25) 0%,
          rgba(243, 243, 240, 0) 70%
        );
        animation: halo 8s ease-in-out infinite;
      }
      @keyframes halo {
        0% {
          transform: scale(1.2);
          opacity: 0.2;
        }
        50% {
          transform: scale(3.4);
          opacity: 0.55;
        }
        100% {
          transform: scale(1.2);
          opacity: 0.2;
        }
      }
      .label {
        position: absolute;
        bottom: -46px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--dim);
        animation: label 8s linear infinite;
      }
      @keyframes label {
        0% {
          content: "";
        }
      }
      .word {
        position: absolute;
        opacity: 0;
        white-space: nowrap;
        animation: fadeWord 8s ease-in-out infinite;
      }
      .word.exhale {
        animation-delay: 4s;
      }
      @keyframes fadeWord {
        0% {
          opacity: 0;
        }
        8% {
          opacity: 1;
        }
        42% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="ring"></div>
      <div class="halo"></div>
      <div class="core"></div>
      <div class="label">
        <span class="word inhale">inhale</span>
        <span class="word exhale">exhale</span>
      </div>
    </div>
  </body>
</html>
