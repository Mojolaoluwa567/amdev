<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A·M — Works</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="shortcut icon"
      href="image/Untitled design (1).png"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --black: #060606;
        --white: #ece9e3;
        --mono: "DM Mono", monospace;
        --display: "Bebas Neue", sans-serif;
        --serif: "Cormorant Garamond", serif;
        --border: rgba(236, 233, 227, 0.07);
        --green: #4ade80;
        --body: rgba(236, 233, 227, 0.94);
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        background: var(--black);
      }
      body {
        background: var(--black);
        color: var(--white);
        font-family: var(--mono);
        overflow-x: hidden;
        cursor: none;
      }
      body::-webkit-scrollbar {
        display: none;
      }
      a,
      button {
        -webkit-tap-highlight-color: transparent;
      }
      /* cursor */
      #cursor {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 9999;
      }
      .c-dot {
        width: 6px;
        height: 6px;
        background: #fff;
        border-radius: 50%;
        position: absolute;
        transform: translate(-50%, -50%);
        transition: opacity 0.3s;
      }
      .c-ring {
        width: 32px;
        height: 32px;
        border: 1px solid rgba(236, 233, 227, 0.4);
        border-radius: 50%;
        position: absolute;
        transform: translate(-50%, -50%);
        transition:
          width 0.35s,
          height 0.35s,
          border-color 0.3s;
      }
      body.cursor-hover .c-dot {
        opacity: 0;
      }
      body.cursor-hover .c-ring {
        width: 52px;
        height: 52px;
        border-color: #fff;
      }
      /* header */
      #site-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 1.6rem 3rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 200;
      }
      .logo {
        font-family: var(--serif);
        font-weight: 300;
        font-style: italic;
        font-size: 1.4rem;
        letter-spacing: 0.1em;
      }
      .logo-dot {
        color: rgba(236, 233, 227, 0.55);
      }
      .site-nav {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }
      .avail-pill {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 8px 14px;
        color: #ddd;
        text-decoration: none;
        font-size: 1rem;
        text-transform: uppercase;
        font-family: var(--display);
        transition: color 0.2s;
        mix-blend-mode: difference;
      }
      .avail-pill:hover,
      .avail-pill.active {
        color: var(--green);
      }
      .pulse {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        animation: blink 2.2s infinite ease-in-out;
      }
      @keyframes blink {
        50% {
          opacity: 0.15;
        }
      }
      .menu-toggle {
        display: none;
        width: 44px;
        height: 44px;
        background: none;
        border: none;
        cursor: pointer;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        z-index: 300;
      }
      .bar {
        display: block;
        width: 24px;
        height: 1px;
        background: #fff;
        transition:
          transform 0.4s,
          opacity 0.3s;
      }
      body.menu-open .bar:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }
      body.menu-open .bar:nth-child(2) {
        opacity: 0;
      }
      body.menu-open .bar:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }
      #mobile-nav {
        position: fixed;
        inset: 0;
        z-index: 250;
        background: rgba(6, 6, 6, 0.98);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 3rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s;
      }
      body.menu-open #mobile-nav {
        opacity: 1;
        pointer-events: auto;
      }
      .mobile-nav-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .mobile-nav-list li {
        overflow: hidden;
      }
      .mobile-nav-list a {
        display: inline-block;
        font-family: var(--display);
        font-size: clamp(2.4rem, 10vw, 4rem);
        text-transform: uppercase;
        color: var(--white);
        text-decoration: none;
        transform: translateY(110%);
        transition:
          transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
          color 0.3s;
        padding: 0.4rem 0;
      }
      body.menu-open .mobile-nav-list a {
        transform: none;
      }
      .mobile-nav-list a:hover {
        color: var(--green);
      }
      /* works stage */
      #works {
        position: relative;
      }
      #stage {
        position: sticky;
        top: 0;
        height: 100vh;
        height: 100svh;
        overflow: hidden;
        background: #000;
        isolation: isolate;
      }
      .bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        filter: grayscale(1) contrast(1.15) brightness(0.85);
        opacity: 0;
      }
      #tint {
        position: absolute;
        inset: 0;
        z-index: 1;
        mix-blend-mode: multiply;
        background: #1f3fe0;
      }
      #shade {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(0, 0, 0, 0.55)
        );
      }
      #card {
        position: absolute;
        z-index: 3;
        left: 50%;
        top: 50%;
        width: min(90vw, 1100px);
        height: min(74vh, 580px);
        transform: translate(-50%, -46%);
        background: #fff;
        color: #0a0a0a;
        overflow: hidden;
        font-family: "Archivo", sans-serif;
      }
      #card > * {
        position: absolute;
      }
      .tw {
        overflow: hidden;
        padding-bottom: 0.08em;
      }
      #ttl {
        display: block;
        font-weight: 900;
        font-size: clamp(2rem, 6.4vw, 6rem);
        line-height: 0.88;
        letter-spacing: -0.05em;
        text-transform: uppercase;
      }
      #meta {
        left: 3%;
        top: 4%;
        font: 400 0.62rem var(--mono);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #555;
      }
      #idx {
        right: 3%;
        top: 4%;
        font: 400 0.62rem var(--mono);
        letter-spacing: 0.18em;
        color: #555;
      }
      #inset {
        overflow: hidden;
        background: #111;
      }
      #inset img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #dsc p {
        font-weight: 800;
        font-size: 0.86rem;
        line-height: 1.35;
        letter-spacing: -0.01em;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      #dsc a {
        display: inline-block;
        margin-top: 0.8rem;
        font: 400 0.64rem var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #0a0a0a;
        text-decoration: none;
        border-bottom: 1px solid #0a0a0a;
        padding-bottom: 2px;
      }
      #dsc a:hover {
        color: #0f8f4a;
        border-color: #0f8f4a;
      }
      #tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-content: flex-start;
      }
      #tags span {
        font: 400 0.56rem var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: 1px solid #0a0a0a;
        padding: 4px 9px;
        white-space: nowrap;
      }
      #bar {
        position: absolute;
        z-index: 4;
        left: 5vw;
        right: 5vw;
        bottom: 3.2vh;
        height: 1px;
        background: rgba(255, 255, 255, 0.25);
      }
      #fill {
        height: 100%;
        width: 0;
        background: var(--green);
      }
      @media (max-width: 900px) {
        #site-header {
          padding: 1.4rem 2rem;
        }
        .site-nav {
          display: none;
        }
        .menu-toggle {
          display: flex;
        }
      }
      @media (max-width: 700px) {
        body {
          cursor: auto;
        }
        #cursor {
          display: none;
        }
        #site-header {
          padding: 1.2rem;
        }
        #card {
          width: 92vw;
          height: 78svh;
        }
        #ttl {
          font-size: clamp(1.8rem, 10vw, 3rem);
        }
        #dsc p {
          font-size: 0.78rem;
          -webkit-line-clamp: 3;
        }
      }
      /* CTA */
      #services-cta {
        position: relative;
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #000;
        border-top: 1px solid rgba(236, 233, 227, 0.08);
      }
      #cta-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .scta-inner {
        position: relative;
        z-index: 2;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        padding: 0 clamp(1.2rem, 6vw, 24px);
      }
      .section-label {
        font-size: 0.65rem;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--green);
      }
      .scta-headline {
        font-family: var(--serif);
        font-weight: 300;
        font-size: clamp(2.2rem, 8vw, 7rem);
        line-height: 1.02;
      }
      .scta-headline em {
        font-style: italic;
        color: rgba(236, 233, 227, 0.55);
      }
      .scta-btn {
        display: inline-flex;
        align-items: center;
        gap: 1rem;
        padding: clamp(0.9rem, 3vw, 1.2rem) clamp(1.6rem, 5vw, 2.8rem);
        border: 1px solid #fff;
        color: var(--white);
        text-decoration: none;
        font-family: var(--display);
        font-size: clamp(0.9rem, 2vw, 1.1rem);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition:
          background 0.4s,
          color 0.4s,
          border-color 0.4s;
      }
      .scta-btn:hover {
        background: var(--green);
        color: #000;
        border-color: transparent;
      }
      .scta-arrow {
        transition: transform 0.4s;
      }
      .scta-btn:hover .scta-arrow {
        transform: translate(3px, -3px);
      }
      footer {
        position: relative;
        z-index: 2;
        padding: 2rem clamp(1.2rem, 5vw, 3rem);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        border-top: 1px solid rgba(236, 233, 227, 0.04);
        font-size: 0.7rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(236, 233, 227, 0.75);
        background: var(--black);
      }
      @media (max-width: 640px) {
        footer {
          text-align: center;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="cursor">
      <div class="c-ring"></div>
      <div class="c-dot"></div>
    </div>

    <header id="site-header">
      <div class="logo">A<span class="logo-dot">·</span>M</div>
      <nav class="site-nav">
        <a href="index.html" class="avail-pill"
          ><span class="pulse"></span>Home</a
        >
        <a href="about.html" class="avail-pill"
          ><span class="pulse"></span>About</a
        >
        <a href="works.html" class="avail-pill active"
          ><span class="pulse"></span>Works</a
        >
        <a href="contact.html" class="avail-pill"
          ><span class="pulse"></span>Get Started</a
        >
      </nav>
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
        <span class="bar"></span><span class="bar"></span
        ><span class="bar"></span>
      </button>
    </header>

    <nav id="mobile-nav" aria-hidden="true">
      <ul class="mobile-nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="works.html">Works</a></li>
        <li><a href="contact.html">Get Started</a></li>
      </ul>
    </nav>

    <section id="works">
      <div id="stage">
        <div id="bgs"></div>
        <div id="tint"></div>
        <div id="shade"></div>
        <div id="card">
          <div id="meta"></div>
          <div id="idx"></div>
          <div id="inset"><img id="insImg" alt="" /></div>
          <div class="tw" id="tw"><h2 id="ttl"></h2></div>
          <div id="dsc">
            <p id="dtxt"></p>
            <a id="view" href="#">View Project ↗</a>
          </div>
          <div id="tags"></div>
        </div>
        <div id="bar"><div id="fill"></div></div>
      </div>
    </section>

    <section id="services-cta">
      <div class="scta-inner">
        <p class="section-label" data-reveal>Ready to build?</p>
        <h2 class="scta-headline" data-reveal>
          Let's make<br /><em>something</em><br />remarkable.
        </h2>
        <a class="scta-btn" href="contact.html" data-reveal
          ><span>Start a Project</span><span class="scta-arrow">↗</span></a
        >
      </div>
      <canvas id="cta-canvas"></canvas>
    </section>

    <footer>
      <span>© 2026 Portfolio</span><span>Built with precision</span
      ><span>By Adeogun Mojola</span>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script>
      gsap.registerPlugin(ScrollTrigger);

      /* smooth scroll */
      if (typeof Lenis !== "undefined") {
        const lenis = new Lenis({
          duration: 1.4,
          easing: (t) => 1 - Math.pow(1 - t, 4),
        });
        lenis.on("scroll", ScrollTrigger.update);
        gsap.ticker.add((t) => lenis.raf(t * 1000));
        gsap.ticker.lagSmoothing(0);
      }

      /* cursor */
      (() => {
        const el = document.getElementById("cursor");
        if (!matchMedia("(pointer: fine)").matches) return;
        const d = el.querySelector(".c-dot"),
          r = el.querySelector(".c-ring");
        let rx = 0,
          ry = 0,
          dx = innerWidth / 2,
          dy = innerHeight / 2;
        addEventListener("mousemove", (e) => {
          dx = e.clientX;
          dy = e.clientY;
        });
        document.querySelectorAll("a,button").forEach((n) => {
          n.addEventListener("mouseenter", () =>
            document.body.classList.add("cursor-hover"),
          );
          n.addEventListener("mouseleave", () =>
            document.body.classList.remove("cursor-hover"),
          );
        });
        (function tick() {
          rx += (dx - rx) * 0.1;
          ry += (dy - ry) * 0.1;
          d.style.left = dx + "px";
          d.style.top = dy + "px";
          r.style.left = rx + "px";
          r.style.top = ry + "px";
          requestAnimationFrame(tick);
        })();
      })();

      /* mobile nav */
      (() => {
        const b = document.body,
          n = document.getElementById("mobile-nav");
        const set = (o) => {
          b.classList.toggle("menu-open", o);
          n.setAttribute("aria-hidden", !o);
        };
        document.getElementById("menu-toggle").onclick = () =>
          set(!b.classList.contains("menu-open"));
        n.querySelectorAll("a").forEach((a) => (a.onclick = () => set(false)));
        addEventListener("keydown", (e) => e.key === "Escape" && set(false));
      })();

      /* ───────── WORKS — website projects only ───────── */
      const P = [
        {
          t: "STUDYMATE",
          y: "2026",
          d: "An AI-powered quiz and study platform built with Flask and React/Vite — multi-format content ingestion, teacher and student roles, gamification, and AI study aids.",
          g: ["Flask", "React", "SQLAlchemy", "Render"],
          i: ["image/studymate1.webp"],
          l: "https://comingsoon-check-back.vercel.app",
        },
        {
          t: "URBANHIVE",
          y: "2025",
          d: "An affordable luxury fashion store where timeless style meets everyday elegance. Browse curated clothing and enjoy a seamless path from discovery to checkout.",
          g: ["Node.js", "PostgreSQL", "Express.js", "Vanilla JS"],
          i: ["image/urbanhive.jpg", "image/3urban.png", "image/4urban.png"],
          l: "https://urbanhive-4der.onrender.com",
        },
        {
          t: "C-CONVERTER",
          y: "2025",
          d: "A fast, intuitive currency conversion platform with accurate exchange rates — simple, seamless, and built for everyday use.",
          g: ["Node.js", "PostgreSQL"],
          i: ["image/ccconverter.jpg", "image/cc-2.png"],
          l: "https://comingsoon-check-back.vercel.app",
        },
        {
          t: "GAMEFOLIO",
          y: "2026",
          d: "A creative 2D game-inspired portfolio landing page — an experimental, playful take on the portfolio, like a mini side-scrolling game.",
          g: ["Vanilla JS", "HTML", "CSS3", "Lenis"],
          i: ["image/game.jpg", "image/2.png", "image/3.png"],
          l: "https://amdev2.vercel.app/",
        },
        {
          t: "HELIOS",
          y: "2026",
          d: "An experimental Three.js-powered 3D portfolio experience built as a solar-system-inspired project archive.",
          g: ["Three.js", "GSAP", "WebGL", "Lenis"],
          i: ["image/helios.jpg", "image/5.png"],
          l: "https://solarsystem-two.vercel.app/",
        },
        {
          t: "ABP INDUSTRIES",
          y: "2024",
          d: "A corporate website for an agricultural company focused on cultivating, processing, packaging and selling staple food products in Nigeria.",
          g: ["Three.js", "GSAP", "WebGL", "Lenis"],
          i: ["image/abpind.jpg", "image/7.png", "image/8.png"],
          l: "https://abpindustries.netlify.app/",
        },
        {
          t: "SMOOTH TRANSIT",
          y: "2025",
          d: "A dark editorial-style aviation consulting website — a premium digital experience for international travel, logistics and VIP aviation support.",
          g: ["JavaScript", "GSAP", "HTML/CSS"],
          i: [
            "image/smoothtransit.jpg",
            "image/smm2.png",
            "image/smm3.png",
            "image/smm4.png",
          ],
          l: "https://smooth-transit.vercel.app",
        },
        {
          t: "PALM & KELL",
          y: "2024",
          d: "A fully horizontal-scrolling luxury hotel website built as a single-page experience — hero to footer on one horizontal axis.",
          g: ["HTML/CSS", "JavaScript", "GSAP", "Lenis"],
          i: ["image/palmkell.jpg", "image/palm2.png", "image/palm3.png"],
          l: "https://comingsoon-check-back.vercel.app",
        },
        {
          t: "QPAT SOLUTIONS",
          y: "2025",
          d: "An education and consulting platform guiding students from first enquiry through to final placement with clarity, structure and purpose.",
          g: ["HTML/CSS", "JavaScript", "WebGL", "Lenis"],
          i: ["image/qpat.jpg", "image/10.png", "image/11.png"],
          l: "https://qpat.netlify.app/",
        },
      ];
      const N = P.length;
      const COL = [
        "#1f3fe0",
        "#e3171b",
        "#0e8f77",
        "#2458e0",
        "#e3171b",
        "#0e8f77",
        "#1f3fe0",
        "#e3171b",
        "#0e8f77",
      ];
      /* layouts in % of card: t=[x,y,w] i=[x,y,w,h] d=[x,y,w] g=[x,y,w] */
      const LD = [
        { t: [3, 12, 56], i: [62, 6, 35, 54], d: [3, 62, 38], g: [3, 88, 56] },
        {
          t: [38, 10, 58],
          i: [4, 7, 30, 62],
          d: [38, 56, 44],
          g: [38, 88, 58],
        },
        { t: [3, 46, 94], i: [33, 6, 34, 38], d: [3, 68, 44], g: [52, 72, 45] },
      ];
      const LM = {
        t: [5, 37, 90],
        i: [5, 9, 90, 26],
        d: [5, 62, 90],
        g: [5, 89, 90],
      };

      const $ = (id) => document.getElementById(id);
      const bgs = $("bgs");
      P.forEach((p, k) => {
        const b = document.createElement("div");
        b.className = "bg";
        if (k < 2) b.style.backgroundImage = `url("${p.i[0]}")`;
        bgs.appendChild(b);
        p.bg = b;
      });
      const load = (k) => {
        const p = P[k];
        if (p && !p.bg.style.backgroundImage)
          p.bg.style.backgroundImage = `url("${p.i[0]}")`;
      };

      function place(el, a, dur) {
        const v = { left: a[0] + "%", top: a[1] + "%", width: a[2] + "%" };
        if (a[3]) v.height = a[3] + "%";
        dur
          ? gsap.to(el, { ...v, duration: dur, ease: "expo.inOut" })
          : gsap.set(el, v);
      }

      let cur = -1,
        busy = false,
        queued = null;
      function show(k, anim) {
        if (k === cur) return;
        if (busy) {
          queued = k;
          return;
        }
        const prev = cur;
        cur = k;
        const p = P[k],
          mob = matchMedia("(max-width:700px)").matches;
        const L = mob ? LM : LD[k % 3];
        load(k);
        load(k + 1);

        const fill = () => {
          $("ttl").textContent = p.t;
          $("meta").textContent = `Website · ${p.y}`;
          $("idx").textContent =
            `${String(k + 1).padStart(2, "0")} / ${String(N).padStart(2, "0")}`;
          $("dtxt").textContent = p.d;
          const v = $("view");
          v.href = p.l;
          v.target = "_blank";
          v.rel = "noopener noreferrer";
          $("tags").innerHTML = p.g.map((t) => `<span>${t}</span>`).join("");
          $("insImg").src = p.i[1] || p.i[0];
        };

        /* background: duotone tint swap + crossfade + slow zoom */
        P.forEach((q, j) =>
          gsap.to(q.bg, {
            opacity: j === k ? 1 : 0,
            duration: anim ? 0.9 : 0,
            ease: "power2.inOut",
          }),
        );
        gsap.fromTo(
          p.bg,
          { scale: 1.14 },
          { scale: 1, duration: 1.6, ease: "expo.out" },
        );
        gsap.to("#tint", {
          backgroundColor: COL[k % COL.length],
          duration: anim ? 0.9 : 0,
        });

        if (!anim) {
          fill();
          place("#tw", L.t);
          place("#inset", L.i);
          place("#dsc", L.d);
          place("#tags", L.g);
          gsap.set("#ttl", { yPercent: 0 });
          return;
        }

        busy = true;
        const tl = gsap.timeline({
          onComplete: () => {
            busy = false;
            if (queued !== null) {
              const q = queued;
              queued = null;
              show(q, true);
            }
          },
        });
        tl.to("#ttl", {
          yPercent: -110,
          skewY: -4,
          duration: 0.35,
          ease: "power3.in",
        })
          .to(
            ["#meta", "#idx", "#dsc", "#tags"],
            { opacity: 0, duration: 0.25 },
            0,
          )
          .to(
            "#inset",
            { scale: 0.88, opacity: 0, duration: 0.3, ease: "power2.in" },
            0,
          )
          .add(() => {
            fill();
            gsap.set("#ttl", { yPercent: 110, skewY: 4 });
            place("#tw", L.t, 0.9);
            place("#dsc", L.d, 0.9);
            place("#tags", L.g, 0.9);
            place("#inset", L.i, 0.9);
          })
          .to(
            "#ttl",
            { yPercent: 0, skewY: 0, duration: 0.8, ease: "expo.out" },
            "+=0.05",
          )
          .to(
            "#inset",
            { scale: 1, opacity: 1, duration: 0.8, ease: "expo.out" },
            "<",
          )
          .to(
            ["#meta", "#idx", "#dsc", "#tags"],
            { opacity: 1, duration: 0.5, stagger: 0.06 },
            "<0.15",
          );
      }

      $("works").style.height = N * 100 + "vh";
      show(0, false);
      ScrollTrigger.create({
        trigger: "#works",
        start: "top top",
        end: "bottom bottom",
        onUpdate: (s) => {
          $("fill").style.width = s.progress * 100 + "%";
          show(Math.min(N - 1, Math.floor(s.progress * N)), true);
        },
      });
      addEventListener("resize", () => {
        const k = cur;
        cur = -1;
        show(k, false);
      });

      /* ───────── CTA particle sphere ───────── */
      (() => {
        const canvas = $("cta-canvas"),
          section = $("services-cta");
        const scene = new THREE.Scene();
        const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
        cam.position.z = 9;
        const ren = new THREE.WebGLRenderer({
          canvas,
          alpha: true,
          antialias: true,
        });
        ren.setPixelRatio(Math.min(devicePixelRatio, 2));
        const size = () => {
          const r = section.getBoundingClientRect();
          ren.setSize(r.width, r.height, false);
          cam.aspect = r.width / r.height || 1;
          cam.updateProjectionMatrix();
        };
        size();
        addEventListener("resize", size);
        const C = innerWidth < 640 ? 500 : 900,
          R = 3.2;
        const pos = new Float32Array(C * 3),
          base = new Float32Array(C * 3),
          sc = new Float32Array(C * 3);
        for (let i = 0; i < C; i++) {
          const ph = Math.acos(-1 + (2 * i) / C),
            th = Math.sqrt(C * Math.PI) * ph;
          base.set(
            [
              R * Math.cos(th) * Math.sin(ph),
              R * Math.sin(th) * Math.sin(ph),
              R * Math.cos(ph),
            ],
            i * 3,
          );
        }
        for (let i = 0; i < C * 3; i++) sc[i] = (Math.random() - 0.5) * 16;
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const pts = new THREE.Points(
          geo,
          new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.035,
            transparent: true,
            opacity: 0.75,
            depthWrite: false,
          }),
        );
        scene.add(pts);
        let mx = 0,
          my = 0,
          cx = 0,
          cy = 0,
          form = 0;
        section.addEventListener("mousemove", (e) => {
          const r = section.getBoundingClientRect();
          mx = (e.clientX - r.left) / r.width - 0.5;
          my = (e.clientY - r.top) / r.height - 0.5;
        });
        ScrollTrigger.create({
          trigger: section,
          start: "top 90%",
          end: "top 30%",
          scrub: 1,
          onUpdate: (s) => (form = s.progress),
        });
        const clock = new THREE.Clock();
        (function loop() {
          requestAnimationFrame(loop);
          const t = clock.getElapsedTime();
          cx += (mx - cx) * 0.05;
          cy += (my - cy) * 0.05;
          for (let i = 0; i < C; i++) {
            const k = i * 3,
              w = Math.sin(t * 0.6 + i) * 0.06;
            pos[k] = THREE.MathUtils.lerp(sc[k], base[k] + w, form);
            pos[k + 1] = THREE.MathUtils.lerp(sc[k + 1], base[k + 1] + w, form);
            pos[k + 2] = THREE.MathUtils.lerp(sc[k + 2], base[k + 2], form);
          }
          geo.attributes.position.needsUpdate = true;
          pts.rotation.y = t * 0.08 + cx * 0.6;
          pts.rotation.x = cy * 0.4;
          ren.render(scene, cam);
        })();
      })();

      gsap.utils
        .toArray("[data-reveal]")
        .forEach((el, i) =>
          gsap.fromTo(
            el,
            { opacity: 0, y: 30 },
            {
              opacity: 1,
              y: 0,
              duration: 1,
              delay: i * 0.1,
              ease: "power3.out",
              scrollTrigger: { trigger: el, start: "top 85%" },
            },
          ),
        );
    </script>
  </body>
</html>
