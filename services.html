<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A·M — Works</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="shortcut icon"
      href="image/Untitled design (1).png"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --black: #060606;
        --white: #ece9e3;
        --mono: "DM Mono", monospace;
        --display: "Bebas Neue", sans-serif;
        --serif: "Cormorant Garamond", serif;
        --border: rgba(236, 233, 227, 0.07);
        --green: #4ade80;
        --body: rgba(236, 233, 227, 0.94);
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        background: var(--black);
      }
      body {
        background: var(--black);
        color: var(--white);
        font-family: var(--mono);
        overflow-x: hidden;
        cursor: none;
      }
      body::-webkit-scrollbar {
        display: none;
      }
      a,
      button {
        -webkit-tap-highlight-color: transparent;
      }
      /* cursor (moved with transforms only) */
      #cursor {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 9999;
      }
      .c-dot,
      .c-ring {
        position: absolute;
        top: 0;
        left: 0;
        border-radius: 50%;
        will-change: transform;
      }
      .c-dot {
        width: 6px;
        height: 6px;
        background: #fff;
        transition: opacity 0.3s;
      }
      .c-ring {
        width: 32px;
        height: 32px;
        border: 1px solid rgba(236, 233, 227, 0.4);
        transition:
          width 0.35s,
          height 0.35s,
          border-color 0.3s;
      }
      body.cursor-hover .c-dot {
        opacity: 0;
      }
      body.cursor-hover .c-ring {
        width: 52px;
        height: 52px;
        border-color: var(--green);
      }
      /* header */
      #site-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 1.6rem 3rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 200;
      }
      .logo {
        font-family: var(--serif);
        font-weight: 300;
        font-style: italic;
        font-size: 1.4rem;
        letter-spacing: 0.1em;
      }
      .logo-dot {
        color: rgba(236, 233, 227, 0.55);
      }
      .site-nav {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }
      /* mix-blend-mode removed: it forced the whole page to be re-blended
         under the fixed header on every scroll frame */
      .avail-pill {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 8px 14px;
        color: #ddd;
        text-decoration: none;
        font-size: 1rem;
        text-transform: uppercase;
        font-family: var(--display);
        transition: color 0.2s;
      }
      .avail-pill:hover,
      .avail-pill.active {
        color: var(--green);
      }
      .pulse {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        animation: blink 2.2s infinite ease-in-out;
      }
      @keyframes blink {
        50% {
          opacity: 0.15;
        }
      }
      .menu-toggle {
        display: none;
        width: 44px;
        height: 44px;
        background: none;
        border: none;
        cursor: pointer;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        z-index: 300;
      }
      .bar {
        display: block;
        width: 24px;
        height: 1px;
        background: #fff;
        transition:
          transform 0.4s,
          opacity 0.3s;
      }
      body.menu-open .bar:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }
      body.menu-open .bar:nth-child(2) {
        opacity: 0;
      }
      body.menu-open .bar:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }
      #mobile-nav {
        position: fixed;
        inset: 0;
        z-index: 250;
        background: rgba(6, 6, 6, 0.98);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 3rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s;
      }
      body.menu-open #mobile-nav {
        opacity: 1;
        pointer-events: auto;
      }
      .mobile-nav-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .mobile-nav-list li {
        overflow: hidden;
      }
      .mobile-nav-list a {
        display: inline-block;
        font-family: var(--display);
        font-size: clamp(2.4rem, 10vw, 4rem);
        text-transform: uppercase;
        color: var(--white);
        text-decoration: none;
        transform: translateY(110%);
        transition:
          transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
          color 0.3s;
        padding: 0.4rem 0;
      }
      body.menu-open .mobile-nav-list a {
        transform: none;
      }
      .mobile-nav-list a:hover {
        color: var(--green);
      }
      /* works stage */
      #works {
        position: relative;
      }
      #stage {
        position: sticky;
        top: 0;
        height: 100vh;
        height: 100svh;
        overflow: hidden;
        background: #000;
        isolation: isolate;
      }
      #bgs {
        position: absolute;
        inset: 0;
      }
      /* Backgrounds are pre-processed (grayscale + colour tint baked into the
         image by JS), so there is NO runtime filter and NO blend mode.
         Only the 1–2 layers currently visible are displayed. */
      .bg {
        position: absolute;
        inset: 0;
        display: none;
        background-size: cover;
        background-position: center;
        opacity: 0;
        will-change: transform, opacity;
      }
      /* fallback if the browser blocks canvas processing (e.g. file://) */
      .bg.raw {
        filter: grayscale(1) contrast(1.15) brightness(0.85);
      }
      #shade {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(0, 0, 0, 0.55)
        );
      }
      #card {
        position: absolute;
        z-index: 3;
        left: 50%;
        top: 50%;
        width: min(90vw, 1100px);
        height: min(74vh, 580px);
        transform: translate(-50%, -46%);
        background: transparent;
        color: #fff;
        overflow: visible;
        font-family: "Archivo", sans-serif;
      }
      #card > * {
        position: absolute;
      }
      /* text column + inset are positioned with transforms (no layout work
         while scrolling); their size only changes while hidden */
      #txt {
        left: 0;
        top: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: clamp(1.1rem, 3vh, 1.9rem);
        will-change: transform;
      }
      #inset {
        left: 0;
        top: 0;
        overflow: hidden;
        background: #111;
        will-change: transform, opacity;
      }
      .tw {
        overflow: visible;
      }
      #ttl {
        display: block;
        font-weight: 900;
        font-size: clamp(2rem, 6.4vw, 6rem);
        line-height: 0.94;
        letter-spacing: -0.05em;
        text-transform: uppercase;
      }
      #meta {
        left: 3%;
        top: 4%;
        font: 400 0.62rem var(--mono);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
      }
      #idx {
        right: 3%;
        top: 4%;
        font: 400 0.62rem var(--mono);
        letter-spacing: 0.18em;
        color: rgba(255, 255, 255, 0.7);
      }
      #inset img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #dsc p {
        font-weight: 700;
        font-size: 0.9rem;
        line-height: 1.55;
        max-width: 46ch;
        letter-spacing: -0.01em;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      #dsc a {
        display: inline-block;
        margin-top: 1.1rem;
        font: 400 0.64rem var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #fff;
        text-decoration: none;
        border-bottom: 1px solid #fff;
        padding-bottom: 2px;
      }
      #dsc a:hover {
        color: var(--green);
        border-color: var(--green);
      }
      #tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-content: flex-start;
      }
      #tags span {
        font: 400 0.56rem var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: 1px solid rgba(255, 255, 255, 0.75);
        padding: 5px 11px;
        white-space: nowrap;
      }
      @media (max-width: 900px) {
        #site-header {
          padding: 1.4rem 2rem;
        }
        .site-nav {
          display: none;
        }
        .menu-toggle {
          display: flex;
        }
      }
      @media (max-width: 700px) {
        body {
          cursor: auto;
        }
        #cursor {
          display: none;
        }
        #site-header {
          padding: 1.2rem;
        }
        #card {
          width: 92vw;
          height: 78svh;
        }
        #ttl {
          font-size: clamp(1.8rem, 10vw, 3rem);
        }
        #dsc p {
          font-size: 0.78rem;
          -webkit-line-clamp: 3;
        }
      }
      /* CTA */
      #services-cta {
        position: relative;
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #000;
        border-top: 1px solid rgba(236, 233, 227, 0.08);
      }
      #cta-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .scta-inner {
        position: relative;
        z-index: 2;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        padding: 0 clamp(1.2rem, 6vw, 24px);
      }
      .section-label {
        font-size: 0.65rem;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--green);
      }
      .scta-headline {
        font-family: var(--serif);
        font-weight: 300;
        font-size: clamp(2.2rem, 8vw, 7rem);
        line-height: 1.02;
      }
      .scta-headline em {
        font-style: italic;
        color: rgba(236, 233, 227, 0.55);
      }
      .scta-btn {
        display: inline-flex;
        align-items: center;
        gap: 1rem;
        padding: clamp(0.9rem, 3vw, 1.2rem) clamp(1.6rem, 5vw, 2.8rem);
        border: 1px solid #fff;
        color: var(--white);
        text-decoration: none;
        font-family: var(--display);
        font-size: clamp(0.9rem, 2vw, 1.1rem);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition:
          background 0.4s,
          color 0.4s,
          border-color 0.4s;
      }
      .scta-btn:hover {
        background: var(--green);
        color: #000;
        border-color: transparent;
      }
      .scta-arrow {
        transition: transform 0.4s;
      }
      .scta-btn:hover .scta-arrow {
        transform: translate(3px, -3px);
      }
      footer {
        position: relative;
        z-index: 2;
        padding: 2rem clamp(1.2rem, 5vw, 3rem);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        border-top: 1px solid rgba(236, 233, 227, 0.04);
        font-size: 0.7rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(236, 233, 227, 0.75);
        background: var(--black);
      }
      @media (max-width: 640px) {
        footer {
          text-align: center;
          justify-content: center;
        }
      }
    </style>
  </head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
      gsap.registerPlugin(ScrollTrigger);
      ScrollTrigger.config({ ignoreMobileResize: true });

      /* Native scrolling (no smooth-scroll library): everything is tied 1:1
         to the scroll position. */

      /* cursor — transforms only, loop sleeps when the cursor is still */
      (() => {
        const el = document.getElementById("cursor");
        if (!matchMedia("(pointer: fine)").matches) return;
        const d = el.querySelector(".c-dot"),
          r = el.querySelector(".c-ring");
        let rx = innerWidth / 2,
          ry = innerHeight / 2,
          dx = rx,
          dy = ry,
          running = false;
        const put = () => {
          d.style.transform = `translate3d(${dx}px,${dy}px,0) translate(-50%,-50%)`;
          r.style.transform = `translate3d(${rx}px,${ry}px,0) translate(-50%,-50%)`;
        };
        const tick = () => {
          rx += (dx - rx) * 0.15;
          ry += (dy - ry) * 0.15;
          put();
          if (Math.abs(dx - rx) > 0.1 || Math.abs(dy - ry) > 0.1)
            requestAnimationFrame(tick);
          else running = false;
        };
        addEventListener(
          "mousemove",
          (e) => {
            dx = e.clientX;
            dy = e.clientY;
            if (!running) {
              running = true;
              requestAnimationFrame(tick);
            }
          },
          { passive: true },
        );
        document.querySelectorAll("a,button").forEach((n) => {
          n.addEventListener("mouseenter", () =>
            document.body.classList.add("cursor-hover"),
          );
          n.addEventListener("mouseleave", () =>
            document.body.classList.remove("cursor-hover"),
          );
        });
        put();
      })();

      /* mobile nav */
      (() => {
        const b = document.body,
          n = document.getElementById("mobile-nav");
        const set = (o) => {
          b.classList.toggle("menu-open", o);
          n.setAttribute("aria-hidden", !o);
        };
        document.getElementById("menu-toggle").onclick = () =>
          set(!b.classList.contains("menu-open"));
        n.querySelectorAll("a").forEach((a) => (a.onclick = () => set(false)));
        addEventListener("keydown", (e) => e.key === "Escape" && set(false));
      })();

      /* ───────── WORKS — fully scroll-driven ───────── */
      const P = [
        {
          t: "STUDYMATE",
          y: "2026",
          d: "An AI-powered quiz and study platform built with Flask and React/Vite — multi-format content ingestion, teacher and student roles, gamification, and AI study aids.",
          g: ["Flask", "React", "SQLAlchemy", "Render"],
          i: ["image/studymate1.webp"],
          l: "https://comingsoon-check-back.vercel.app",
        },
        {
          t: "URBANHIVE",
          y: "2025",
          d: "An affordable luxury fashion store where timeless style meets everyday elegance. Browse curated clothing and enjoy a seamless path from discovery to checkout.",
          g: ["Node.js", "PostgreSQL", "Express.js", "Vanilla JS"],
          i: ["image/urbanhive.jpg", "image/3urban.png", "image/4urban.png"],
          l: "https://urbanhive-4der.onrender.com",
        },
        {
          t: "C-CONVERTER",
          y: "2025",
          d: "A fast, intuitive currency conversion platform with accurate exchange rates — simple, seamless, and built for everyday use.",
          g: ["Node.js", "PostgreSQL"],
          i: ["image/ccconverter.jpg", "image/cc-2.png"],
          l: "https://comingsoon-check-back.vercel.app",
        },
        {
          t: "GAMEFOLIO",
          y: "2026",
          d: "A creative 2D game-inspired portfolio landing page — an experimental, playful take on the portfolio, like a mini side-scrolling game.",
          g: ["Vanilla JS", "HTML", "CSS3", "Lenis"],
          i: ["image/game.jpg", "image/2.png", "image/3.png"],
          l: "https://amdev2.vercel.app/",
        },
        {
          t: "HELIOS",
          y: "2026",
          d: "An experimental Three.js-powered 3D portfolio experience built as a solar-system-inspired project archive.",
          g: ["Three.js", "GSAP", "WebGL", "Lenis"],
          i: ["image/helios.jpg", "image/5.png"],
          l: "https://solarsystem-two.vercel.app/",
        },
        {
          t: "ABP INDUSTRIES",
          y: "2024",
          d: "A corporate website for an agricultural company focused on cultivating, processing, packaging and selling staple food products in Nigeria.",
          g: ["Three.js", "GSAP", "WebGL", "Lenis"],
          i: ["image/abpind.jpg", "image/7.png", "image/8.png"],
          l: "https://abpindustries.netlify.app/",
        },
        {
          t: "SMOOTH TRANSIT",
          y: "2025",
          d: "A dark editorial-style aviation consulting website — a premium digital experience for international travel, logistics and VIP aviation support.",
          g: ["JavaScript", "GSAP", "HTML/CSS"],
          i: [
            "image/smoothtransit.jpg",
            "image/smm2.png",
            "image/smm3.png",
            "image/smm4.png",
          ],
          l: "https://smooth-transit.vercel.app",
        },
        {
          t: "PALM & KELL",
          y: "2024",
          d: "A fully horizontal-scrolling luxury hotel website built as a single-page experience — hero to footer on one horizontal axis.",
          g: ["HTML/CSS", "JavaScript", "GSAP", "Lenis"],
          i: ["image/palmkell.jpg", "image/palm2.png", "image/palm3.png"],
          l: "https://comingsoon-check-back.vercel.app",
        },
        {
          t: "QPAT SOLUTIONS",
          y: "2025",
          d: "An education and consulting platform guiding students from first enquiry through to final placement with clarity, structure and purpose.",
          g: ["HTML/CSS", "JavaScript", "WebGL", "Lenis"],
          i: ["image/qpat.jpg", "image/10.png", "image/11.png"],
          l: "https://qpat.netlify.app/",
        },
      ];
      const N = P.length;
      const COL = [
        "#1f3fe0",
        "#e3171b",
        "#0e8f77",
        "#2458e0",
        "#e3171b",
        "#0e8f77",
        "#1f3fe0",
        "#e3171b",
        "#0e8f77",
      ];
      /* layouts in % of card: x=[left, top, width] of the text column,
         i=[left, top, width, height] of the inset image */
      const LD = [
        { x: [3, 14, 50], i: [60, 9, 37, 56] }, // text left,  image right
        { x: [40, 14, 56], i: [3, 9, 32, 64] }, // image left, text right
        { x: [3, 52, 94], i: [30, 9, 40, 34] }, // image top,  text below
      ];
      const LM = { x: [5, 31, 90], i: [5, 9, 90, 19] };

      /* TUNING
         VH_PER_PROJECT : scrolling each project takes (vh)
         H              : half-width of the transition between two projects
                          (0.3 = transition is 60% of a project's scroll) */
      const VH_PER_PROJECT = 90;
      const H = 0.3;

      const $ = (id) => document.getElementById(id);
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const mix = (A, B, t) => A.map((v, i) => lerp(v, B[i], t));

      const bgs = $("bgs");
      P.forEach((p) => {
        const b = document.createElement("div");
        b.className = "bg";
        bgs.appendChild(b);
        p.bg = b;
        p.lo = 0; /* last opacity written */
        p.lz = -1; /* last scale written   */
      });

      /* ── image preparation ──────────────────────────────────────────────
         Each background is downscaled (max 1600px) and the grayscale /
         contrast / brightness / colour tint is baked in ONCE with a canvas.
         Result: no CSS filter, no mix-blend-mode and much smaller textures
         to move around while scrolling. Insets are downscaled too. */
      const loadImg = (src) =>
        new Promise((res, rej) => {
          const im = new Image();
          im.decoding = "async";
          im.onload = () => res(im);
          im.onerror = rej;
          im.src = src;
        });
      const toUrl = (c, type, q) =>
        new Promise((res) =>
          c.toBlob((b) => res(URL.createObjectURL(b)), type, q),
        );
      const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
      const scaled = (im, maxW) => {
        const w = Math.min(maxW, im.naturalWidth),
          h = Math.round((w * im.naturalHeight) / im.naturalWidth);
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const x = c.getContext("2d", { willReadFrequently: true });
        x.drawImage(im, 0, 0, w, h);
        return { c, x, w, h };
      };

      async function prepare(k) {
        const p = P[k];
        if (!p || p.prep) return p && p.prep;
        p.prep = (async () => {
          try {
            const [bgImg, inImg] = await Promise.all([
              loadImg(p.i[0]),
              p.i[1] ? loadImg(p.i[1]) : null,
            ]);
            /* inset: downscale only */
            const ins = scaled(inImg || bgImg, 1000);
            p.insetUrl = await toUrl(ins.c, "image/jpeg", 0.88);
            if (shown === k) $("insImg").src = p.insetUrl;
            /* background: grayscale + contrast + brightness + tint, baked */
            const bgc = scaled(bgImg, 1600);
            const data = bgc.x.getImageData(0, 0, bgc.w, bgc.h);
            const px = data.data,
              col = hex(COL[k % COL.length]);
            for (let i = 0; i < px.length; i += 4) {
              let g = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
              g = ((g - 128) * 1.15 + 128) * 0.85;
              g = g < 0 ? 0 : g > 255 ? 255 : g;
              g /= 255;
              px[i] = g * col[0];
              px[i + 1] = g * col[1];
              px[i + 2] = g * col[2];
            }
            bgc.x.putImageData(data, 0, 0);
            p.bgUrl = await toUrl(bgc.c, "image/jpeg", 0.82);
            p.bg.style.backgroundImage = `url("${p.bgUrl}")`;
          } catch (e) {
            /* canvas blocked (e.g. opened from file://): use originals */
            p.bg.classList.add("raw");
            p.bg.style.backgroundImage = `url("${p.i[0]}")`;
          }
        })();
        return p.prep;
      }
      const load = (k) => {
        prepare(k);
        prepare(k + 1);
      };
      /* prepare the rest quietly in the background */
      (async () => {
        await prepare(0);
        await prepare(1);
        const idle = window.requestIdleCallback || ((f) => setTimeout(f, 200));
        for (let k = 2; k < N; k++) {
          await new Promise((r) => idle(r));
          await prepare(k);
        }
      })();

      const el = {
        txt: $("txt"),
        ttl: $("ttl"),
        inset: $("inset"),
        dsc: $("dsc"),
        tags: $("tags"),
        meta: $("meta"),
        idx: $("idx"),
      };

      /* cached measurements */
      let cw = 0,
        ch = 0,
        mob = false;
      const measure = () => {
        const card = $("card");
        cw = card.offsetWidth;
        ch = card.offsetHeight;
        mob = matchMedia("(max-width:700px)").matches;
      };

      let shown = -1,
        staticKey = -1;
      function fill(k) {
        const p = P[k];
        $("ttl").textContent = p.t;
        $("meta").textContent = `Website · ${p.y}`;
        $("idx").textContent =
          `${String(k + 1).padStart(2, "0")} / ${String(N).padStart(2, "0")}`;
        $("dtxt").textContent = p.d;
        const v = $("view");
        v.href = p.l;
        v.target = "_blank";
        v.rel = "noopener noreferrer";
        $("tags").innerHTML = p.g.map((t) => `<span>${t}</span>`).join("");
        $("insImg").src = p.insetUrl || p.i[1] || p.i[0];
      }
      /* sizes change only here — at the midpoint, while hidden */
      function applySize(k) {
        const L = mob ? LM : LD[k % 3];
        el.txt.style.width = L.x[2] + "%";
        el.inset.style.width = L.i[2] + "%";
        el.inset.style.height = L.i[3] + "%";
      }

      /* u runs 0 → N-1 with the scroll. Project k is "centred" at u = k.
         Between k and k+1 there is a transition window (t: 0 → 1). */
      function state(u) {
        const k = Math.floor(u);
        const d = u - (k + 0.5);
        if (k >= 0 && k <= N - 2 && Math.abs(d) < H)
          return { a: k, b: k + 1, t: (d + H) / (2 * H) };
        const idx = clamp(d < 0 ? k : k + 1, 0, N - 1);
        return { a: idx, b: idx, t: 0 };
      }

      const seg = (x, s0, e0) => clamp((x - s0) / (e0 - s0), 0, 1);
      const easeIn = (x) => x * x * x;
      const easeOut = (x) => 1 - Math.pow(1 - x, 3);
      const smalls = [
        [el.meta, 0.15, 0.85],
        [el.idx, 0.15, 0.85],
        [el.dsc, 0.25, 1],
        [el.tags, 0.35, 1],
      ];

      /* Pure function of scroll position: no tweens, no timers. */
      function render(u) {
        const { a, b, t } = state(u);
        const moving = a !== b;

        load(a);
        load(b);
        load(b + 1);

        /* backgrounds: only touch what changed; hidden layers are display:none */
        P.forEach((p, k) => {
          const o = moving
            ? k === a
              ? 1 - t
              : k === b
                ? t
                : 0
            : k === a
              ? 1
              : 0;
          if (o !== p.lo) {
            p.bg.style.display = o > 0 ? "block" : "none";
            p.bg.style.opacity = o;
            p.lo = o;
          }
          if (o > 0) {
            const z = 1 + 0.1 * clamp(1 - (u - (k - 0.5)), 0, 1);
            if (z !== p.lz) {
              p.bg.style.transform = `scale(${z})`;
              p.lz = z;
            }
          }
        });

        /* content swaps at the midpoint (everything is faded out then) */
        const s = t < 0.5 ? a : b;
        if (s !== shown) {
          fill(s);
          applySize(s);
          shown = s;
        }

        /* nothing else changes while a project is simply "held" */
        if (!moving) {
          if (staticKey === a) return;
          staticKey = a;
        } else staticKey = -1;

        const LA = mob ? LM : LD[a % 3],
          LB = mob ? LM : LD[b % 3];
        const te = t * t * (3 - 2 * t); /* eased, still driven by scroll */

        /* positions glide with transforms only */
        el.txt.style.transform = `translate3d(${(lerp(LA.x[0], LB.x[0], te) * cw) / 100}px,${(lerp(LA.x[1], LB.x[1], te) * ch) / 100}px,0)`;
        el.inset.style.transform = `translate3d(${(lerp(LA.i[0], LB.i[0], te) * cw) / 100}px,${(lerp(LA.i[1], LB.i[1], te) * ch) / 100}px,0) scale(${1 - 0.12 * hI(t, moving)})`;
        el.inset.style.opacity = 1 - hI(t, moving);

        /* title: slides + fades (no skew, no clipping mask) */
        const dir = t < 0.5 ? -1 : 1; /* leaves upward, arrives from below */
        const hT = hid(t, moving, 0, 0.75);
        el.ttl.style.opacity = 1 - hT;
        el.ttl.style.transform = `translateY(${hT * dir * 45}%)`;

        /* small texts: fade + short rise */
        for (const [n, s0, e0] of smalls) {
          const h = hid(t, moving, s0, e0);
          n.style.opacity = 1 - h;
          n.style.transform = `translateY(${h * dir * 16}px)`;
        }
      }
      /* h: 0 = fully shown, 1 = fully hidden (staggered per element) */
      function hid(t, moving, s0, e0) {
        if (!moving) return 0;
        const out = clamp(t * 2, 0, 1),
          inn = clamp(t * 2 - 1, 0, 1);
        return t < 0.5
          ? easeIn(seg(out, s0, e0))
          : 1 - easeOut(seg(inn, s0, e0));
      }
      const hI = (t, moving) => hid(t, moving, 0.1, 0.85);

      const works = $("works");
      works.style.height = (N - 1) * VH_PER_PROJECT + 100 + "vh";

      let lastU = 0;
      measure();
      ScrollTrigger.create({
        trigger: "#works",
        start: "top top",
        end: "bottom bottom",
        onUpdate: (s) => {
          lastU = s.progress * (N - 1);
          render(lastU);
        },
        onRefresh: (s) => {
          measure();
          lastU = s.progress * (N - 1);
          shown = -1;
          staticKey = -1;
          render(lastU);
        },
      });
      render(0);

      /* ───────── CTA particle sphere (scroll-driven) ───────── */
      (() => {
        const canvas = $("cta-canvas"),
          section = $("services-cta");
        const scene = new THREE.Scene();
        const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
        cam.position.z = 9;
        const ren = new THREE.WebGLRenderer({
          canvas,
          alpha: true,
          antialias: false /* points don't need MSAA; big GPU saving */,
          powerPreference: "high-performance",
        });
        ren.setPixelRatio(Math.min(devicePixelRatio, 1.5));
        const size = () => {
          const r = section.getBoundingClientRect();
          ren.setSize(r.width, r.height, false);
          cam.aspect = r.width / r.height || 1;
          cam.updateProjectionMatrix();
        };
        size();
        addEventListener("resize", size);
        const C = innerWidth < 640 ? 500 : 900,
          R = 3.2;
        const pos = new Float32Array(C * 3),
          base = new Float32Array(C * 3),
          sc = new Float32Array(C * 3);
        for (let i = 0; i < C; i++) {
          const ph = Math.acos(-1 + (2 * i) / C),
            th = Math.sqrt(C * Math.PI) * ph;
          base.set(
            [
              R * Math.cos(th) * Math.sin(ph),
              R * Math.sin(th) * Math.sin(ph),
              R * Math.cos(ph),
            ],
            i * 3,
          );
        }
        for (let i = 0; i < C * 3; i++) sc[i] = (Math.random() - 0.5) * 16;
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const pts = new THREE.Points(
          geo,
          new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.035,
            transparent: true,
            opacity: 0.75,
            depthWrite: false,
          }),
        );
        scene.add(pts);
        let mx = 0,
          my = 0,
          cx = 0,
          cy = 0,
          form = 0;
        section.addEventListener(
          "mousemove",
          (e) => {
            const r = section.getBoundingClientRect();
            mx = (e.clientX - r.left) / r.width - 0.5;
            my = (e.clientY - r.top) / r.height - 0.5;
          },
          { passive: true },
        );
        ScrollTrigger.create({
          trigger: section,
          start: "top 90%",
          end: "top 30%",
          onUpdate: (s) => (form = s.progress),
        });

        /* only render while the section is on screen */
        let visible = false;
        new IntersectionObserver(([e]) => (visible = e.isIntersecting), {
          rootMargin: "100px",
        }).observe(section);

        (function loop() {
          requestAnimationFrame(loop);
          if (!visible) return;
          const sy = window.scrollY; /* rotation + wobble follow the scroll */
          cx += (mx - cx) * 0.05;
          cy += (my - cy) * 0.05;
          for (let i = 0; i < C; i++) {
            const k = i * 3,
              w = Math.sin(sy * 0.004 + i) * 0.06;
            pos[k] = THREE.MathUtils.lerp(sc[k], base[k] + w, form);
            pos[k + 1] = THREE.MathUtils.lerp(sc[k + 1], base[k + 1] + w, form);
            pos[k + 2] = THREE.MathUtils.lerp(sc[k + 2], base[k + 2], form);
          }
          geo.attributes.position.needsUpdate = true;
          pts.rotation.y = sy * 0.0012 + cx * 0.6;
          pts.rotation.x = cy * 0.4;
          ren.render(scene, cam);
        })();
      })();

      /* reveal: scrubbed to scroll (no timed animation) */
      gsap.utils.toArray("[data-reveal]").forEach((n) =>
        gsap.fromTo(
          n,
          { opacity: 0, y: 30 },
          {
            opacity: 1,
            y: 0,
            ease: "none",
            scrollTrigger: {
              trigger: n,
              start: "top 95%",
              end: "top 70%",
              scrub: true,
            },
          },
        ),
      );
    </script>
  </body>
</html>
